name: CI

# Runs on every push and pull request. Deployment waits for this: the app is used
# offline in the field, so a broken build is not something a grower can refresh away.
on:
  push:
    # main is deliberately excluded: the deploy workflow calls this one as its gate,
    # so a push to main would otherwise run the same suite twice on the same commit.
    branches-ignore: ["main"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded feature-branch runs are worth cancelling. The run on main is the
  # deploy gate, so it queues instead - cancelling it would fail the deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Static checks alone catch a syntax error, a missing translation or
      # hand-edited generated data, and they finish in under a second.
      - name: Static checks
        run: node tests/run.js --filter static

      - name: Install Playwright Chromium
        run: |
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser and mobile checks
        run: node tests/run.js
